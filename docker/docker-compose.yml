# FCT Stats - Production Docker Compose
# This runs only the web server with nginx reverse proxy

services:
  webapp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webapp
    container_name: fct_stats_webapp
    restart: unless-stopped
    volumes:
      # Mount database from host (updated via scraper on dev machine)
      - ../data:/app/data:ro
      # Analytics DB lives in a named volume at a separate path (not under read-only /app/data)
      - analytics_data:/app/analytics
      # Mount config from host so meets/calendar updates don't require a rebuild
      - ../config:/app/config:ro
    environment:
      - DATABASE_PATH=/app/data/db/fct_stats.db
      - ANALYTICS_DB_PATH=/app/analytics/analytics.db
      - CONFIG_PATH=/app/config
      - VIRTUAL_HOST=track.fchsrunning.org
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  analytics_data:
    # Persists analytics DB across container rebuilds and publishes
