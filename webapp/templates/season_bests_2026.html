{% extends "base.html" %}

{% block title %}2026 Leaderboard - FC Track & Field{% endblock %}

{% block content %}
<style>
#genderTabs .nav-link {
    color: #4B286D !important;
    border-color: #4B286D #4B286D #dee2e6 !important;
    background-color: #f8f9fa !important;
    font-weight: 500;
}
#genderTabs .nav-link:hover {
    color: #C4A000 !important;
    border-color: #C4A000 #C4A000 #dee2e6 !important;
}
#genderTabs .nav-link.active {
    color: #C4A000 !important;
    background-color: #4B286D !important;
    border-color: #4B286D #4B286D #4B286D !important;
}

.event-cards-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
    gap: 0.35rem;
    margin-bottom: 3rem;
}

.event-card {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    transition: all 0.3s ease;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    padding: 0.3rem 0.25rem;
    position: relative;
    text-align: center;
    min-height: 55px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.event-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
}

.event-card.running {
    background: linear-gradient(135deg, #4B286D 0%, #6b4090 100%);
    color: white;
}

.event-card.field {
    background: linear-gradient(135deg, #C4A000 0%, #e6c300 100%);
    color: #2d3748;
}

.event-card.active {
    transform: scale(1.1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.event-card-title {
    font-size: 0.75rem;
    font-weight: 700;
    word-break: break-word;
    line-height: 1.1;
}

.results-section {
    margin-top: 2rem;
}

.results-header {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--fc-purple);
    border-bottom: 3px solid var(--fc-gold);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
}

.athlete-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.athlete-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.75rem 0;
    border-bottom: 1px solid #e0e0e0;
    font-size: 0.95rem;
}

.athlete-item:last-child {
    border-bottom: none;
}

.athlete-rank {
    font-weight: 700;
    margin-right: 1rem;
    min-width: 2rem;
    color: var(--fc-purple);
}

.athlete-name {
    flex-grow: 1;
}

.athlete-name a {
    color: var(--fc-purple);
    text-decoration: none;
    font-weight: 500;
}

.athlete-name a:hover {
    color: var(--fc-gold);
    text-decoration: underline;
}

.athlete-mark {
    font-weight: 700;
    min-width: 100px;
    text-align: right;
}

.show-more-btn {
    width: 100%;
    margin-top: 1rem;
    padding: 0.75rem;
    border: 2px solid var(--fc-purple);
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    color: var(--fc-purple);
    transition: all 0.3s ease;
}

.show-more-btn:hover {
    background-color: var(--fc-purple);
    color: white;
}

.show-more-btn:active {
    transform: scale(0.98);
}

.extra-result {
    display: none;
}

.extra-result.show {
    display: flex;
}

.no-selection {
    text-align: center;
    padding: 2rem;
    color: #999;
    font-size: 1.1rem;
}

@media (max-width: 640px) {
    .event-cards-container {
        grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
        gap: 0.35rem;
    }
    
    .event-card {
        padding: 0.3rem 0.25rem;
        min-height: 55px;
        font-size: 0.75rem;
    }
}
</style>

<div class="container mt-4">
    <h1 class="mb-4"><i class="bi bi-trophy"></i> 2026 Leaderboard</h1>
    
    <!-- Tabs for Boys/Girls -->
    <ul class="nav nav-tabs" id="genderTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="boys-tab" data-bs-toggle="tab" data-bs-target="#boys" type="button" role="tab" aria-controls="boys" aria-selected="true">
                Boys
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="girls-tab" data-bs-toggle="tab" data-bs-target="#girls" type="button" role="tab" aria-controls="girls" aria-selected="false">
                Girls
            </button>
        </li>
    </ul>
    
    <div class="tab-content mt-4" id="genderTabContent">
        <!-- Boys Tab -->
        <div class="tab-pane fade show active" id="boys" role="tabpanel" aria-labelledby="boys-tab">
            <!-- Event Cards Container -->
            <div class="event-cards-container" id="boys-cards"></div>
            
            <!-- Results Section -->
            <div class="results-section">
                <div id="boys-results">
                    <div class="no-selection">Select an event to view results</div>
                </div>
            </div>
        </div>
        
        <!-- Girls Tab -->
        <div class="tab-pane fade" id="girls" role="tabpanel" aria-labelledby="girls-tab">
            <!-- Event Cards Container -->
            <div class="event-cards-container" id="girls-cards"></div>
            
            <!-- Results Section -->
            <div class="results-section">
                <div id="girls-results">
                    <div class="no-selection">Select an event to view results</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Prepare data structure for all events
const eventData = {
    boys: {},
    girls: {}
};

// Populate boys events
{% if boys_sprint %}{% for event_name, results in boys_sprint.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if boys_middle_distance %}{% for event_name, results in boys_middle_distance.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if boys_distance %}{% for event_name, results in boys_distance.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if boys_hurdles %}{% for event_name, results in boys_hurdles.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if boys_relays %}{% for event_name, results in boys_relays.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if boys_field %}{% for event_name, results in boys_field.items() %}
eventData.boys['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'field' };
{% endfor %}{% endif %}

// Populate girls events
{% if girls_sprint %}{% for event_name, results in girls_sprint.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if girls_middle_distance %}{% for event_name, results in girls_middle_distance.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if girls_distance %}{% for event_name, results in girls_distance.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if girls_hurdles %}{% for event_name, results in girls_hurdles.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if girls_relays %}{% for event_name, results in girls_relays.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'running' };
{% endfor %}{% endif %}

{% if girls_field %}{% for event_name, results in girls_field.items() %}
eventData.girls['{{ event_name }}'] = { data: {{ results|tojson }}, category: 'field' };
{% endfor %}{% endif %}

// Format time
function formatTime(seconds) {
    if (!seconds && seconds !== 0) return '';
    if (seconds >= 60) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${minutes}:${secs.toFixed(2).padStart(5, '0')}`;
    }
    return seconds.toFixed(2);
}

// Format mark for field events
function formatMark(mark, isField, eventName) {
    if (!mark && mark !== 0) return '';
    if (!isField) return formatTime(mark);
    
    const jumpEvents = ['Long Jump', 'Triple Jump', 'High Jump', 'Discus', 'Shot Put', 'Pole Vault'];
    if (eventName && jumpEvents.includes(eventName)) {
        const feet = mark / 0.3048;
        const wholeFeet = Math.floor(feet);
        const inches = (feet - wholeFeet) * 12;
        return `${wholeFeet}' ${inches.toFixed(1)}"`;
    }
    return mark.toFixed(2) + 'm';
}

// Render results
function renderResults(gender, eventName) {
    const container = document.getElementById(`${gender}-results`);
    
    if (!eventData[gender][eventName]) {
        container.innerHTML = '<div class="no-selection">No data available</div>';
        return;
    }
    
    const eventInfo = eventData[gender][eventName];
    const results = eventInfo.data;
    const isField = eventInfo.category === 'field';
    
    let html = `
        <div class="results-header">${gender.charAt(0).toUpperCase() + gender.slice(1)} - ${eventName}</div>
        <ol class="athlete-list">
    `;
    
    results.forEach((result, index) => {
        const isExtra = index >= 10;
        const mark = isField ? formatMark(result.mark, true, eventName) : formatTime(result.mark);
        const athleteName = result.athlete_name || 'Unknown';
        const athleteId = result.athlete_id;
        
        let athleteHtml = '';
        if (athleteId) {
            athleteHtml = `<a href="/athlete/${athleteId}">${athleteName}</a>`;
        } else {
            athleteHtml = athleteName;
        }
        
        html += `
            <li class="athlete-item${isExtra ? ' extra-result' : ''}">
                <span class="athlete-rank">#${index + 1}</span>
                <span class="athlete-name">${athleteHtml}</span>
                <span class="athlete-mark">${mark}</span>
            </li>
        `;
    });
    
    html += '</ol>';
    
    if (results.length > 10) {
        html += `<button class="show-more-btn" onclick="toggleShowMore(this)">Show More (${results.length - 10} more)</button>`;
    }
    
    container.innerHTML = html;
}

// Render event cards
function renderEventCards(gender) {
    const container = document.getElementById(`${gender}-cards`);
    let html = '';
    
    for (const eventName in eventData[gender]) {
        const category = eventData[gender][eventName].category;
        const cardClass = `event-card ${category}`;
        html += `
            <div class="${cardClass}" onclick="selectEvent('${gender}', '${eventName}')">
                <div class="event-card-title">${eventName}</div>
            </div>
        `;
    }

    if (html === '') {
        container.innerHTML = '<p class="text-muted fst-italic">No results yet for the 2026 season.</p>';
        return;
    }
    
    container.innerHTML = html;
}

// Select event
function selectEvent(gender, eventName) {
    // Remove active class from all cards
    document.getElementById(`${gender}-cards`).querySelectorAll('.event-card').forEach(card => {
        card.classList.remove('active');
    });
    
    // Add active class to selected card - find the card with matching text
    const cards = document.getElementById(`${gender}-cards`).querySelectorAll('.event-card');
    cards.forEach(card => {
        if (card.textContent.trim() === eventName) {
            card.classList.add('active');
        }
    });
    
    // Render results
    renderResults(gender, eventName);

    // On mobile, scroll to the results section
    if (window.innerWidth < 768) {
        document.getElementById(`${gender}-results`).scrollIntoView({behavior: 'smooth', block: 'start'});
    }
}

// Toggle show more
function toggleShowMore(button) {
    const list = button.previousElementSibling;
    const extraResults = list.querySelectorAll('.extra-result');
    
    if (button.classList.contains('expanded')) {
        extraResults.forEach(item => item.classList.remove('show'));
        button.classList.remove('expanded');
        const total = list.children.length;
        const excess = total - 10;
        button.textContent = `Show More (${excess} more)`;
    } else {
        extraResults.forEach(item => item.classList.add('show'));
        button.classList.add('expanded');
        button.textContent = 'Show Less';
    }
}

// Initialize on load
document.addEventListener('DOMContentLoaded', function() {
    renderEventCards('boys');
    renderEventCards('girls');
});
</script>
{% endblock %}
